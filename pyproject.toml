[project]
name = "balaambot"
version = "0.1.0"
description = "A discord bot for dutty beats"
authors = [
    { name = "James Wild", email = "wild.james343@gmail.com" },
    { name = "Jibby", email = "Jibbajabbafic@users.noreply.github.com" },
]
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "anyio>=4.14.1",
    "dotenv>=0.9.9",
    "pynacl>=1.5.0",
    "discord-ext-voice-recv>=0.4.2a145",
    "yt-dlp[default]>=2026.7.4",
    "pytest-cov>=6.1.1",
    "pyjokes>=0.8.3",
    "pydantic>=2.13.4",
    "redis>=8.0.1",
    "pytest-asyncio>=1.4.0",
    "rapidfuzz>=3.13.0",
    "discord-py>=2.7.1",
    "fastapi>=0.140.13",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.51.0",
]

# Dev tools
[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipython>=8.37.0",
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.20",
]

[project.scripts]
balaambot = "balaambot:main.start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
